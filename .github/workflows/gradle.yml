name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    # Tests only; the release trigger is `create` below.
  # A tag ref fires `create` whether it was pushed over Git or created on the server (Releases
  # page, `gh release create`, the refs API). `push` would only cover moving an existing tag,
  # which cannot republish a released version anyway, so recreate instead of moving. `create`
  # also fires for branch creation, so the jobs gate on the tag ref and `resolve` re-checks the
  # semver shape.
  create:
  workflow_dispatch:

jobs:
  unit-tests:
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Generate Allure Report for Unit Tests
        run: ./gradlew allureReport

      - name: Upload Unit Test Reports (Allure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-unit-test-report
          path: build/reports/allure-report/allureReport

  e2e-tests:
    if: github.event_name != 'create' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Docker Compose (Spin up services)
        run: docker compose up -d

      - name: Run E2E Tests
        run: ./gradlew testE2E

      - name: Generate Allure Report for Unit Tests
        run: ./gradlew allureReport

      - name: Upload Unit Test Reports (Allure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-e2e-test-report
          path: build/reports/allure-report/allureReport

  # Pull requests publish an identifiable snapshot: <base>-pr<N>-<commit>-SNAPSHOT.
  snapshot:
    name: Publish PR snapshot
    if: github.event_name == 'pull_request'
    needs:
      - unit-tests
      - e2e-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and publish snapshot
        run: ./gradlew build publishMavenJavaPublicationToGitHubPackagesRepository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A semver tag is the release trigger: pushing v1.2.3 publishes 1.2.3. The tag is the
  # version, so CI never creates one; it only advances the snapshot seed on main, so the
  # next branch and PR already build the next number.
  resolve:
    name: Check the release tag
    if: github.event_name == 'create' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      next: ${{ steps.semver.outputs.next }}
      allowed: ${{ steps.author.outputs.allowed }}

    steps:
      - name: Match the tag against semver
        id: semver
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            IFS=. read -r major minor patch <<< "${tag#v}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "next=${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '$tag' is not vMAJOR.MINOR.PATCH; nothing is published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check who created the tag
        id: author
        env:
          GH_TOKEN: ${{ github.token }}        # gh reads GH_TOKEN, not GITHUB_TOKEN
        run: |
          # Tag protection rules are the primary gate; this backstops a tag that
          # gets created by someone who cannot release.
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission) || permission=none
          echo "${GITHUB_ACTOR} created ${GITHUB_REF#refs/tags/} with ${permission} access." >> "$GITHUB_STEP_SUMMARY"
          case "${permission}" in
            admin|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  release:
    name: Publish release tag
    if: needs.resolve.outputs.version != '' && needs.resolve.outputs.allowed == 'true'
    needs:
      - unit-tests
      - e2e-tests
      - resolve
    runs-on: ubuntu-latest
    permissions:
      # write so the release run can push the seed branch and open its pull request
      contents: write
      pull-requests: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: GPG checks
        run: |
          which gpg
          gpg --version

      - name: Decode GPG Key
        run: |
          mkdir -p ~/.gradle/
          echo "${{secrets.MAVEN_CENTRAL_GPG_KEY_BASE64}}" > ~/.gradle/secring.gpg.b64
          base64 -d ~/.gradle/secring.gpg.b64 > ~/.gradle/secring.gpg
          echo "${{secrets.MAVEN_CENTRAL_GPG_PASSPHRASE}}" | gpg --batch --yes --passphrase-fd 0 --import ~/.gradle/secring.gpg
          gpg --keyserver hkps://keys.openpgp.org --send-key 3B36C37F3005FE8BB8B30DC26B12ADFA0BE0D092

      - name: Build and publish release
        run: ./gradlew build publish jreleaserDeploy
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_KEYNAME: "3B36C37F3005FE8BB8B30DC26B12ADFA0BE0D092"
          JRELEASER_GPG_PASSPHRASE: "${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}"
          JRELEASER_MAVENCENTRAL_USERNAME: "${{ secrets.MAVEN_CENTRAL_OSSRH_USERNAME }}"
          JRELEASER_MAVENCENTRAL_PASSWORD: "${{ secrets.MAVEN_CENTRAL_OSSRH_TOKEN }}"

      - name: Open the snapshot seed bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The released version is the tag, so main only needs the seed moved to the next
          # patch. `main` refuses direct pushes, so the bump is proposed as a pull request.
          version="${{ needs.resolve.outputs.version }}"
          next="${{ needs.resolve.outputs.next }}"
          branch="chore/bump-baseVersion-$next"
          if [ -n "$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "An open pull request already proposes $next." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git fetch origin main
          git checkout -B "$branch" origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898263+github-actions[bot]@users.noreply.github.com'
          sed -i "s/^baseVersion=.*/baseVersion=$next/" gradle.properties
          if git diff --quiet; then
            echo "baseVersion is already $next; nothing to propose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -am "chore: bump baseVersion to $next [skip ci]"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: bump baseVersion to $next" \
            --body "Released \`$version\` from \`v$version\`. This moves the snapshot seed to \`$next\` so new branches and PRs inherit it."
