name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Generate Allure Report for Unit Tests
        run: ./gradlew allureReport

      - name: Upload Unit Test Reports (Allure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-unit-test-report
          path: build/reports/allure-report/allureReport

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Docker Compose (Spin up services)
        run: docker compose up -d

      - name: Run E2E Tests
        run: ./gradlew testE2E

      - name: Generate Allure Report for Unit Tests
        run: ./gradlew allureReport

      - name: Upload Unit Test Reports (Allure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-e2e-test-report
          path: build/reports/allure-report/allureReport

  # Pull requests publish an identifiable snapshot: <base>-pr<N>-<commit>-SNAPSHOT.
  snapshot:
    name: Publish PR snapshot
    if: github.event_name == 'pull_request'
    needs:
      - unit-tests
      - e2e-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and publish snapshot
        run: ./gradlew build publishMavenJavaPublicationToGitHubPackagesRepository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A merge to main publishes baseVersion as a real release, tags that commit,
  # then bumps baseVersion so the next branch/PR already builds the next number.
  release:
    name: Release merge to main
    if: github.event_name != 'pull_request'
    needs:
      - unit-tests
      - e2e-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: GPG checks
        run: |
          which gpg
          gpg --version

      - name: Decode GPG Key
        run: |
          mkdir -p ~/.gradle/
          echo "${{secrets.MAVEN_CENTRAL_GPG_KEY_BASE64}}" > ~/.gradle/secring.gpg.b64
          base64 -d ~/.gradle/secring.gpg.b64 > ~/.gradle/secring.gpg
          echo "${{secrets.MAVEN_CENTRAL_GPG_PASSPHRASE}}" | gpg --batch --yes --passphrase-fd 0 --import ~/.gradle/secring.gpg
          gpg --keyserver hkps://keys.openpgp.org --send-key 3B36C37F3005FE8BB8B30DC26B12ADFA0BE0D092

      - name: Resolve version
        id: version
        run: |
          base=$(sed -n 's/^baseVersion=\([^ ]*\).*/\1/p' gradle.properties)
          IFS=. read -r major minor patch <<< "$base"
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "gradle.properties baseVersion is not major.minor.patch, got '${base}'" >&2
            exit 1
          fi
          next="${major}.${minor}.$((patch + 1))"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          if git ls-remote --tags origin "refs/tags/v${base}" | grep -q .; then
            echo "v${base} is already released; skipping publish, tag, and bump."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish release
        if: steps.version.outputs.new == 'true'
        run: ./gradlew build publish jreleaserDeploy
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.base }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_KEYNAME: "3B36C37F3005FE8BB8B30DC26B12ADFA0BE0D092"
          JRELEASER_GPG_PASSPHRASE: "${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}"
          JRELEASER_MAVENCENTRAL_USERNAME: "${{ secrets.MAVEN_CENTRAL_OSSRH_USERNAME }}"
          JRELEASER_MAVENCENTRAL_PASSWORD: "${{ secrets.MAVEN_CENTRAL_OSSRH_TOKEN }}"

      - name: Tag the release commit and bump base version
        if: steps.version.outputs.new == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898263+github-actions[bot]@users.noreply.github.com'
          git tag -a "v${{ steps.version.outputs.base }}" -m "release ${{ steps.version.outputs.base }}"
          git push origin "refs/tags/v${{ steps.version.outputs.base }}"
          sed -i "s/^baseVersion=.*/baseVersion=${{ steps.version.outputs.next }}/" gradle.properties
          git commit -am "chore: bump baseVersion to ${{ steps.version.outputs.next }} [skip ci]"
          git push origin HEAD:main
