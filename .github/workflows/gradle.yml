name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
    # Release trigger. Action filters cannot express digit classes, so the glob
    # catches every v-tag and the release job re-checks the exact semver shape.
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Generate Allure Report for Unit Tests
        run: ./gradlew allureReport

      - name: Upload Unit Test Reports (Allure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-unit-test-report
          path: build/reports/allure-report/allureReport

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run Docker Compose (Spin up services)
        run: docker compose up -d

      - name: Run E2E Tests
        run: ./gradlew testE2E

      - name: Generate Allure Report for Unit Tests
        run: ./gradlew allureReport

      - name: Upload Unit Test Reports (Allure)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-e2e-test-report
          path: build/reports/allure-report/allureReport

  # Pull requests publish an identifiable snapshot: <base>-pr<N>-<commit>-SNAPSHOT.
  snapshot:
    name: Publish PR snapshot
    if: github.event_name == 'pull_request'
    needs:
      - unit-tests
      - e2e-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build and publish snapshot
        run: ./gradlew build publishMavenJavaPublicationToGitHubPackagesRepository
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A semver tag is the release trigger: pushing v1.2.3 publishes 1.2.3. CI no
  # longer tags or bumps anything, so a release is a deliberate act by whoever is
  # allowed to create tags (see RELEASE.md).
  resolve:
    name: Check the release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
      allowed: ${{ steps.author.outputs.allowed }}

    steps:
      - name: Match the tag against semver
        id: semver
        run: |
          if echo "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "Tag '${GITHUB_REF_NAME}' is not vMAJOR.MINOR.PATCH; nothing is published." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check who pushed the tag
        id: author
        run: |
          # Tag protection rules are the primary gate; this backstops a tag that
          # gets created by someone who cannot release.
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${GITHUB_ACTOR}/permission" --jq .permission)
          echo "${GITHUB_ACTOR} pushed ${GITHUB_REF_NAME} with ${permission} access." >> "$GITHUB_STEP_SUMMARY"
          case "${permission}" in
            admin|write) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  release:
    name: Publish release tag
    if: needs.resolve.outputs.version != '' && needs.resolve.outputs.allowed == 'true'
    needs:
      - unit-tests
      - e2e-tests
      - resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: GPG checks
        run: |
          which gpg
          gpg --version

      - name: Decode GPG Key
        run: |
          mkdir -p ~/.gradle/
          echo "${{secrets.MAVEN_CENTRAL_GPG_KEY_BASE64}}" > ~/.gradle/secring.gpg.b64
          base64 -d ~/.gradle/secring.gpg.b64 > ~/.gradle/secring.gpg
          echo "${{secrets.MAVEN_CENTRAL_GPG_PASSPHRASE}}" | gpg --batch --yes --passphrase-fd 0 --import ~/.gradle/secring.gpg
          gpg --keyserver hkps://keys.openpgp.org --send-key 3B36C37F3005FE8BB8B30DC26B12ADFA0BE0D092

      - name: Build and publish release
        run: ./gradlew build publish jreleaserDeploy
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_GPG_KEYNAME: "3B36C37F3005FE8BB8B30DC26B12ADFA0BE0D092"
          JRELEASER_GPG_PASSPHRASE: "${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}"
          JRELEASER_MAVENCENTRAL_USERNAME: "${{ secrets.MAVEN_CENTRAL_OSSRH_USERNAME }}"
          JRELEASER_MAVENCENTRAL_PASSWORD: "${{ secrets.MAVEN_CENTRAL_OSSRH_TOKEN }}"
